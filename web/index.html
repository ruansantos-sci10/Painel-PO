<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Painel do PO</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <script>
      // Aplica o tema escolhido antes de desenhar a página (veja src/composables/useTema.js)
      try {
        var tema = { claro: "light", escuro: "dark" }[localStorage.getItem("painel-tema")];
        if (tema) document.documentElement.dataset.theme = tema;
      } catch (e) { /* sem storage: segue o sistema */ }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
